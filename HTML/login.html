<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LearnHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.88)),
                url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3");

            background-size: cover;
            background-position: center;
        }

        .container {
            width: 400px;
            padding: 35px;

            border-radius: 25px;

            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.20);

            box-shadow: 0 0 40px rgba(0,0,0,0.6);

            animation: showBox 0.8s ease;
        }

        @keyframes showBox {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
        }

        .tab {
            width: 50%;
            padding: 13px;

            border: none;
            background: transparent;

            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .tab.active {
            color: #00eaff;
            border-bottom: 3px solid #00eaff;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;
            margin-bottom: 18px;

            border: 1px solid rgba(255,255,255,0.2);
            outline: none;

            border-radius: 10px;

            background: rgba(255,255,255,0.12);

            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #bbb;
        }

        input:focus {
            border-color: #00eaff;
            box-shadow: 0 0 10px rgba(0,234,255,0.4);
        }

        .submit-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(90deg, #00eaff, #7c00ff);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.05);

            box-shadow:
                0 0 20px #00eaff,
                0 0 35px #7c00ff;
        }

        .free {
            text-align: center;
            margin-top: 20px;

            color: #00eaff;
            font-weight: bold;
        }

        .home-btn {
            display: block;

            width: 100%;

            margin-top: 20px;
            padding: 13px;

            border: 1px solid #00eaff;
            border-radius: 30px;

            color: #00eaff;

            text-align: center;
            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .home-btn:hover {
            background: #00eaff;
            color: black;

            transform: scale(1.05);

            box-shadow: 0 0 20px #00eaff;
        }

        @media (max-width: 450px) {
            .container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Welcome</h1>

        <p class="subtitle">
            Join our free learning platform
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                onclick="showSignup()">

                Sign Up

            </button>

            <button
                class="tab"
                onclick="showLogin()">

                Login

            </button>

        </div>


        <!-- SIGN UP -->

        <form
            id="signupForm"
            class="form active"
            onsubmit="signup(event)">

            <label>Full Name</label>

            <input
                type="text"
                placeholder="Enter your full name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                placeholder="Create password"
                required
            >


            <button
                type="submit"
                class="submit-btn">

                Create Account 🚀

            </button>

        </form>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="form"
            onsubmit="login(event)">

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="submit-btn">

                Login 🔐

            </button>

        </form>


        <p class="free">
            🎓 All Courses Are FREE
        </p>


        <a
            href="index.html"
            class="home-btn">

            🏠 Back to Home

        </a>

    </div>


    <script>

        /* SHOW SIGN UP */

        function showSignup() {

            document
                .getElementById("signupForm")
                .classList.add("active");

            document
                .getElementById("loginForm")
                .classList.remove("active");

            document
                .querySelectorAll(".tab")[0]
                .classList.add("active");

            document
                .querySelectorAll(".tab")[1]
                .classList.remove("active");
        }


        /* SHOW LOGIN */

        function showLogin() {

            document
                .getElementById("loginForm")
                .classList.add("active");

            document
                .getElementById("signupForm")
                .classList.remove("active");

            document
                .querySelectorAll(".tab")[1]
                .classList.add("active");

            document
                .querySelectorAll(".tab")[0]
                .classList.remove("active");
        }


        /* SIGN UP */

        function signup(event) {

            event.preventDefault();

            // Directly go to courses page
            window.location.href = "courses.html";
        }


        /* LOGIN */

        function login(event) {

            event.preventDefault();

            // Directly go to courses page
            window.location.href = "courses.html";
        }

    </script>

</body>

</html>

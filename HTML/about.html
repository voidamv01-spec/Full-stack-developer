<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>About Me</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            /* Background Image */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.70)
                ),
                url("https://images.unsplash.com/photo-1511497584788-876760111969");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;

            padding: 20px;
        }


        /* Main Box */

        .container {

            max-width: 700px;

            padding: 50px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.5);

            animation: pageEnter 1.5s ease;
        }


        /* Page Animation */

        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

        }


        /* Heading */

        h1 {

            font-size: 88px;

            margin-bottom: 40px;

            color: #38bdf8;

            animation: headingFloat 3s infinite ease-in-out;
        }


        @keyframes headingFloat {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }

        }


        /* Paragraph */

        p {

            font-size: 20px;

            line-height: 1.8;

            color: #e5e7eb;

            margin-bottom: 35px;
        }


        /* Back Button */

        .back-btn {

            display: inline-block;

            padding: 16px 35px;

            border-radius: 50px;

            text-decoration: none;

            color: white;

            font-size: 18px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #2563eb,
                    #7c3aed
                );

            background-size: 200%;

            box-shadow:
                0 0 15px #2563eb;

            transition: 0.4s;

            animation: buttonGlow 2s infinite alternate;
        }


        /* Button Glow */

        @keyframes buttonGlow {

            from {

                box-shadow:
                    0 0 10px #06b6d4;

            }

            to {

                box-shadow:
                    0 0 30px #7c3aed,
                    0 0 50px #2563eb;

            }

        }


        /* Hover */

        .back-btn:hover {

            transform:
                scale(1.12)
                translateY(-6px);

            background-position: right;

            box-shadow:
                0 0 25px #06b6d4,
                0 0 50px #7c3aed;
        }


        /* Click */

        .back-btn:active {

            transform: scale(0.92);

        }


        /* Mobile */

        @media (max-width: 600px) {

            .container {

                padding: 35px 20px;

            }

            h1 {

                font-size: 40px;

            }

            p {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
         Full stack Developer 👨‍💻
        </h1>


        <p>

            Selling courses for free.

            <br><br>

            HTML,CSS,JAVA .

            <br><br>

            My Dream is provide the knowladge about
            CSS, HTML & java Script for students who can't afford 
            high budget courses. 🚀
             
        </p>


        <!-- next  -->

        <a href="detail.html"
           class="back-btn">

            Next Page 

        </a>

    </div>


</body>

</html>
